name: Sync Fork from byJoey/cfnew
on:
  schedule:
    # UTC 0点 = 北京时间 08:00，每天早上8点自动同步
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动点击运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream byJoey/cfnew to wanggilbert/myTube
        uses: aormsby/Fork-Sync-With-Upstream-action@v2
        with:
          upstream_repository: byJoey/cfnew
          target_branch: main
          upstream_branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}
